name: Arc detector reference

on:
  pull_request:
    paths: ["arc_detector/**", ".github/workflows/arc-reference.yml"]
  push:
    branches: [main]
    paths: ["arc_detector/**", ".github/workflows/arc-reference.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r arc_detector/requirements.txt
      - name: Test reference algorithm and replay
        run: python -m unittest discover -s arc_detector/tests -p 'test_*.py' -v
