; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[common]
lib_deps_builtin =
    LittleFS
    SPI
    Wire

[env:teensy41]
; Fully pinned toolchain. Two reasons, both learned from CI:
;  1. Teensyduino 1.60+ bundles a full MTP implementation in cores/teensy4
;     (MTP_Teensy.cpp, MTP_Storage.cpp), which shadows and then collides at
;     link time with the patched copy in lib/MTP_Teensy - and that copy is
;     what makes USB file access safe here (read-only enforcement plus
;     watchdog service inside otherwise unbounded loops; see
;     lib/MTP_Teensy/PATCHES.md). 1.159.0 has no core MTP, so ours is used.
;  2. The framework and the compiler have to move together: an unpinned
;     platform pairs this framework with a newer GCC that rejects
;     imxrt.h's integer-to-pointer reinterpret_cast in constant
;     expressions, which breaks the build before reaching any of our code.
; CI pins its runner, actions, PlatformIO/gcovr and gzip metadata, then performs
; two clean builds and byte-compares firmware.hex. That proves repeatability in
; the pinned CI environment; it is not a claim that every host OS emits the same
; bytes. Before unpinning: either drop lib/MTP_Teensy and
; re-apply its safety properties on top of the core's copy, or drop USB MTP.
platform = teensy@5.0.0
board = teensy41
framework = arduino
platform_packages =
    framework-arduinoteensy @ 1.159.0
    toolchain-gccarmnoneeabi-teensy @ 1.110301.0
extra_scripts =
    pre:scripts/gzip_web_assets.py
    pre:scripts/git_version.py
; Exact versions, not caret ranges. The platform/framework/toolchain above are
; pinned; leaving the libraries on "^x.y.z" meant the same commit could build
; against different library code on different days, with nothing in the repo to
; show it. Firmware that drives power hardware should eventually make a commit
; mean one binary; pinned CI now enforces that invariant for its own environment.
; Bump deliberately, one library at a time, and re-run the bench checks.
;
; The last two are transitive (BusIO <- SSD1306, OneWire <- DallasTemperature).
; They are named explicitly because an unpinned transitive dependency floats just
; as freely as a direct one.
lib_deps =
    ${common.lib_deps_builtin}
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.17
	sstaub/TeensyID@1.4.0
	milesburton/DallasTemperature@4.0.6
	latimes2/InternalTemperature@2.1.1-a
	bblanchon/ArduinoJson@7.4.3
	ssilverman/QNEthernet@0.36.0
	greiman/SdFat@2.3.1
	pedvide/Teensy_ADC@9.1.0
	knolleary/PubSubClient@2.8.0
	adafruit/Adafruit BusIO@1.17.4
	paulstoffregen/OneWire@2.3.8
; Skip framework libraries the dependency finder pulls in but nothing uses
; (Wiznet Ethernet + VirtualWire were being compiled for no reason)
lib_ignore =
    Ethernet
    VirtualWire
; The framework's SD wrapper hard-errors against upstream SdFat (it wants its
; own bundled 2.1.2 copy), and USBHost_t36 pulls in EEPROM; neither is used -
; MTP reaches the card through src/sd_fs_adapter.h instead
    SD
    USBHost_t36
; Teensy PlatformIO otherwise appends -O2 after project flags. Select one
; unambiguous release mode: GNU++17 (the pinned framework ABI) and O2/LTO.
; A whole-program -O3 build was measured here and consumed roughly another
; 65 KiB of RAM1/ITCM, leaving only ~25 KiB for stack and locals. That is an
; unacceptable reliability trade on a control firmware. The latency-critical
; ISR paths are kept in ITCM with FASTRUN and are measured with DWT counters;
; raise individual functions to O3 only after a benchmark proves a gain.
build_unflags =
    -Os
build_flags =
    -O2
    -flto
; The pinned Teensy USB core declares its C and C++ serial-number descriptor
; through structurally identical but LTO-distinct types. GCC warns that strict
; aliasing could misoptimise that upstream boundary; disable only that unsafe
; assumption while retaining LTO's cross-unit size and speed benefits.
    -fno-strict-aliasing
; USB composite: CDC serial + MTP. Must be bare (no "=1"): the teensy
; builder matches this token to suppress its default -DUSB_SERIAL, and a
; "=1" form silently defines BOTH, which picks plain serial and breaks the
; MTP build. The _SERIAL variant is required so Serial (and pio device
; monitor) keeps working - plain USB_MTPDISK exposes an HID pseudo-serial
; instead. Note the USB PID changes to 0x04D5, so the COM port may move.
    -DUSB_MTPDISK_SERIAL
; Let GCC inline roundf/sqrtf as single FPU instructions instead of libm calls
    -fno-math-errno
; miniz: only the inflate core is used (gzip upload ingest) - drop the
; zip-archive and stdio portions
    -DMINIZ_NO_ARCHIVE_APIS
    -DMINIZ_NO_STDIO
    -DMINIZ_NO_TIME
; SdFat intentionally declines to typedef core FS::File when FS.h exists;
; suppress that upstream informational #warning. Include order prevents the
; separate FILE_READ/FILE_WRITE macro redefinition.
    -DDISABLE_FS_H_WARNING
; Surface accidental float->double promotions (double is half-rate on the M7 FPU);
; applied to src/ only so third-party library noise doesn't drown the signal
build_src_flags =
    -Wall
    -Wextra
    -Wdouble-promotion

; Host-native unit tests for the hardware-independent logic (pio test -e native).
; Built with gcov instrumentation; CI gates line coverage of the tested units
; at 80% via gcovr.
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -I src
    -std=gnu++17
    -Wall
    -Wextra
    --coverage
    -lgcov
    -DMINIZ_NO_ARCHIVE_APIS
    -DMINIZ_NO_STDIO
    -DMINIZ_NO_TIME

; Host-native ASan/UBSan regression suite. On Windows, use the MSYS2 CLANG64
; toolchain and keep clang64/bin on PATH while the tests run so the ASan DLL
; can be loaded. CI runs this environment with Ubuntu's native compiler.
[env:native-sanitize]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -I src
    -std=gnu++17
    -Wall
    -Wextra
    -O1
    -g
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-optimize-sibling-calls
    -fno-sanitize-recover=all
    -DMINIZ_NO_ARCHIVE_APIS
    -DMINIZ_NO_STDIO
    -DMINIZ_NO_TIME
