[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit SSD1306@^2.5.13
	sstaub/TeensyID@^1.3.3
	milesburton/DallasTemperature@^3.11.0
	latimes2/InternalTemperature@^2.1.1-a
	amcewen/HttpClient@^2.2.0
	bblanchon/ArduinoJson@^7.3.0
	luni64/TeensyTimerTool@^1.4.1
	ssilverman/QNEthernet@^0.29.1
	greiman/SdFat@^2.3.0
