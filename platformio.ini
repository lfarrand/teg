; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[common]
lib_deps_builtin =
    LittleFS
    SPI
    Wire

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extra_scripts = pre:scripts/gzip_web_assets.py
lib_deps =
    ${common.lib_deps_builtin}
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
	sstaub/TeensyID@^1.4.0
	milesburton/DallasTemperature@^4.0.6
	latimes2/InternalTemperature@^2.1.1-a
	amcewen/HttpClient@^2.2.0
	bblanchon/ArduinoJson@^7.4.3
	luni64/TeensyTimerTool@^1.4.1
	ssilverman/QNEthernet@^0.36.0
	greiman/SdFat@^2.3.1
; Skip framework libraries the dependency finder pulls in but nothing uses
; (Wiznet Ethernet + VirtualWire were being compiled for no reason)
lib_ignore =
    Ethernet
    VirtualWire
build_unflags = -Os
build_flags =
    -std=c++23
    -O3
    -flto
; Let GCC inline roundf/sqrtf as single FPU instructions instead of libm calls
    -fno-math-errno
; Surface accidental float->double promotions (double is half-rate on the M7 FPU);
; applied to src/ only so third-party library noise doesn't drown the signal
build_src_flags =
    -Wdouble-promotion

; Host-native unit tests for the hardware-independent logic (pio test -e native).
; Built with gcov instrumentation; CI gates line coverage of the tested units
; at 80% via gcovr.
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
build_flags =
    -I src
    -std=gnu++17
    -Wall
    -Wextra
    --coverage
    -lgcov
